type: object
required: [isbn, title, author, publishedDate]
properties:
  isbn:
    type: string
    minLength: 1
    example: "9780134685991"
  title:
    type: string
    minLength: 1
    example: Effective Java
  author:
    type: string
    minLength: 1
    example: Joshua Bloch
  publishedDate:
    type: string
    format: date
    example: 2018-01-06
