parameters:
  - $ref: "../components/parameters/CourseIdParam.yml"
get:
  tags: [Courses]
  summary: Get a course by ID
  operationId: getCourseById
  responses:
    "200":
      description: Course found
      content:
        application/json:
          schema:
            $ref: "../components/schemas/course/CourseResponse.yml"
    "404":
      $ref: "../components/responses/CourseNotFound.yml"
put:
  tags: [Courses]
  summary: Update a course
  operationId: updateCourse
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/course/CourseUpdateRequest.yml"
  responses:
    "200":
      description: Course updated
      content:
        application/json:
          schema:
            $ref: "../components/schemas/course/CourseResponse.yml"
    "400":
      $ref: "../components/responses/ValidationError.yml"
    "404":
      $ref: "../components/responses/CourseNotFound.yml"
    "409":
      $ref: "../components/responses/DuplicateResource.yml"
delete:
  tags: [Courses]
  summary: Delete a course
  description: |
    Deleting a course removes all associated student_course records,
    then deletes the course. Enrolled students are not deleted.
  operationId: deleteCourse
  responses:
    "204":
      description: Course deleted successfully
    "404":
      $ref: "../components/responses/CourseNotFound.yml"
