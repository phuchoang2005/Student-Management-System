post:
  tags: [Books]
  summary: Create a book
  description: A newly created book is unassigned (studentId = null).
  operationId: createBook
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/book/BookCreateRequest.yml"
  responses:
    "201":
      description: Book created successfully
      headers:
        Location:
          description: URI of the newly created book
          schema:
            type: string
            example: /api/v1/books/10
      content:
        application/json:
          schema:
            $ref: "../components/schemas/book/BookResponse.yml"
    "400":
      $ref: "../components/responses/ValidationError.yml"
    "409":
      $ref: "../components/responses/DuplicateResource.yml"
get:
  tags: [Books]
  summary: Get a paginated list of books
  operationId: getBooks
  parameters:
    - $ref: "../components/parameters/PageParam.yml"
    - $ref: "../components/parameters/SizeParam.yml"
    - $ref: "../components/parameters/SortParam.yml"
    - $ref: "../components/parameters/SearchParam.yml"
  responses:
    "200":
      description: Paginated list of books
      content:
        application/json:
          schema:
            $ref: "../components/schemas/PageBookResponse.yml"
