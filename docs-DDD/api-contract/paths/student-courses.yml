parameters:
  - $ref: "../components/parameters/StudentIdParam.yml"
get:
  tags: [Student Courses]
  summary: Get all courses a student is enrolled in
  operationId: getStudentCourses
  responses:
    "200":
      description: Courses enrolled by the student (empty array if none)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas/course/CourseResponse.yml"
    "404":
      $ref: "../components/responses/StudentNotFound.yml"
