BookCreateRequest:
  type: object
  required: [isbn, title, author]
  properties:
    isbn:
      type: string
      maxLength: 20
    title:
      type: string
      maxLength: 255
    author:
      type: string
      maxLength: 255
    publishedDate:
      type: string
      format: date
      nullable: true
    ownerStudentCode:
      type: string
      maxLength: 20
      nullable: true
      example: S00123
      description: |
        Optional initial holder, named by business-key code — the surrogate `books.owner_id` is
        resolved server-side and never supplied by a caller (api-specification.md §5 decision #9).
        Must reference an existing student, or the request is rejected with 400.

BookOwnerRequest:
  type: object
  required: [studentCode]
  properties:
    studentCode:
      type: string
      maxLength: 20
      example: S00123
      description: Must reference an existing student, or the request is rejected with 400.

BookResponse:
  type: object
  description: No surrogate `id`, and the holder is named by code — see BookCreateRequest.ownerStudentCode.
  required: [isbn, title, author, publishedDate, ownerStudentCode, createdAt, updatedAt]
  properties:
    isbn:
      type: string
    title:
      type: string
    author:
      type: string
    publishedDate:
      type: string
      format: date
      nullable: true
    ownerStudentCode:
      type: string
      nullable: true
      description: '`null` when the book is unowned.'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

BookSummary:
  type: object
  required: [isbn, title, author, ownerStudentCode]
  properties:
    isbn:
      type: string
    title:
      type: string
    author:
      type: string
    ownerStudentCode:
      type: string
      nullable: true
      description: '`null` when the book is unowned.'

BookDetail:
  description: A book's full record plus the current holder's summary, if any.
  allOf:
    - $ref: '#/BookResponse'
    - type: object
      properties:
        owner:
          type: object
          nullable: true
          allOf:
            - $ref: './student.yaml#/StudentSummary'

BookPage:
  description: A page of book summaries.
  allOf:
    - $ref: './common.yaml#/PageMeta'
    - type: object
      required: [content]
      properties:
        content:
          type: array
          items:
            $ref: '#/BookSummary'
