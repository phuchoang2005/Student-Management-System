Role:
  type: string
  description: The five fixed roles in the system. Staff roles (Registrar, Librarian, Course Administrator) are created by a System Administrator (`POST /staff-accounts`); Student accounts are auto-provisioned on student registration; the System Administrator role itself is pre-seeded out-of-band and never created through this API.
  enum:
    - SYSTEM_ADMINISTRATOR
    - REGISTRAR
    - LIBRARIAN
    - COURSE_ADMINISTRATOR
    - STUDENT

Error:
  type: object
  description: Spring Boot's default error body shape. No custom error envelope is defined elsewhere in the design docs, so this idiomatic default is used for every non-2xx response.
  required: [timestamp, status, error, message, path]
  properties:
    timestamp:
      type: string
      format: date-time
    status:
      type: integer
      example: 404
    error:
      type: string
      example: Not Found
    message:
      type: string
      example: Student with code 'S12345' was not found.
    path:
      type: string
      example: /api/v1/students/S12345

FieldError:
  type: object
  required: [field, message]
  properties:
    field:
      type: string
      example: email
    message:
      type: string
      example: must be a well-formed email address

ValidationError:
  description: An Error whose 400 response also lists which field(s) failed validation.
  allOf:
    - $ref: '#/Error'
    - type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: '#/FieldError'

PageMeta:
  type: object
  description: Page metadata shared by every paginated list/roster response, mirroring Spring Data's `Page<T>` JSON shape.
  required: [page, size, totalElements, totalPages]
  properties:
    page:
      type: integer
      format: int32
      example: 0
    size:
      type: integer
      format: int32
      example: 20
    totalElements:
      type: integer
      format: int64
      example: 57
    totalPages:
      type: integer
      format: int32
      example: 3

MeProfile:
  type: object
  description: |
    The calling Student's own record — the only way a Student learns their own `studentCode`, since
    the login response carries just `{role, mustChangePassword}` and this API has no session probe.
    Matches `StudentDetail` minus the audit timestamps, which exist for the Registrar's record-keeping.
  required: [studentCode, firstName, lastName, email, dateOfBirth]
  properties:
    studentCode:
      type: string
      example: S00123
    firstName:
      type: string
    lastName:
      type: string
    email:
      type: string
      format: email
    dateOfBirth:
      type: string
      format: date

MeBookPage:
  description: A page of the calling Student's own held books. No owner field — every row is theirs.
  allOf:
    - $ref: '#/PageMeta'
    - type: object
      required: [content]
      properties:
        content:
          type: array
          items:
            type: object
            required: [isbn, title, author]
            properties:
              isbn:
                type: string
              title:
                type: string
              author:
                type: string

MeCoursePage:
  description: A page of the calling Student's own enrolled courses.
  allOf:
    - $ref: '#/PageMeta'
    - type: object
      required: [content]
      properties:
        content:
          type: array
          items:
            $ref: './course.yaml#/CourseSummary'
