# PM-029: the only profile where actuator is exposed over HTTP -- closes hazard H8
# (01-benchmark-strategy.md §8). Only health, metrics, and prometheus are exposed; nothing else
# under /actuator/** is needed for this benchmark set and each additional endpoint is its own
# surface to reason about.
management.endpoints.web.exposure.include=health,metrics,prometheus

# PM-031 (04-workload-data-preparation.md §4.3): demo accounts must be off for a benchmark run so
# the seeded users table is not a silent variable between runs. Fixed here rather than left as a
# manual step someone can forget.
app.demo-accounts.enabled=false

# Actuator serves on its own embedded connector under this profile only. Paired with
# SecurityConfig#managementPortFilterChain (permitAll, matched by local port rather than path) so
# Prometheus can scrape it without a session login, while :8080/actuator/** keeps the
# SYSTEM_ADMINISTRATOR gate untouched (PM-029). See bench/observability/README.md.
management.server.port=8081

# p50/p95/p99 as exported gauges (not histogram buckets) -- what the Benchmark Overview and
# HTTP & Load Testing dashboards chart directly (06-dashboard-building.md).
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles.hikaricp.connections.acquire=0.95,0.99

# tomcat_threads_* only appear once Tomcat's own MBeans are registered (off by default; the
# tomcat_sessions_* metrics don't need it, but thread-pool metrics do) -- the Spring Boot Runtime
# dashboard's Tomcat panel needs this.
server.tomcat.mbeanregistry.enabled=true
