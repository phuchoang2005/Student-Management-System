spring.application.name=management

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:management}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:management}
spring.datasource.password=${MYSQL_PASSWORD:management}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.web.pageable.max-page-size=100

# Base64 AES key for users.initial_password_encrypted (Identity.5, US-6.3). The literal below is a
# development/CI default only -- every real environment must set INITIAL_PASSWORD_KEY, since key
# storage and rotation are explicitly a build/ops concern (04-authentication-authorization.md §9).
app.security.initial-password-key=${INITIAL_PASSWORD_KEY:IoUV19v5ZzBW//5PXWmx12fm2R5TCiYpC6tnlrftOT0=}

# PM-017: GET /api/v1/auth/demo-accounts, a dev/QA convenience only (04-authentication-authorization.md
# §8). True by default here; application-prod.properties overrides this to false, which is the load-
# bearing safety guarantee -- the route and its seed data must not exist in production at all.
app.demo-accounts.enabled=true

# PM-029: actuator web exposure is OFF by default -- explicitly empty, not merely absent, since
# Spring Boot's own default without this key is "health only". application-benchmark.properties is
# the only place this is turned on (01-benchmark-strategy.md §8), closing hazard H8 without adding
# a new surface to every other profile.
management.endpoints.web.exposure.include=
