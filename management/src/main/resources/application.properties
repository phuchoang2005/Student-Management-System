spring.application.name=management

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:management}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:management}
spring.datasource.password=${MYSQL_PASSWORD:management}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.web.pageable.max-page-size=100

# PM-040: the framework default (10) saturates at exactly 10 concurrent VUs (BM-XC-003) --
# actuator showed 10/10 connections active and 31-33 threads pending, sustained for a full 30-
# minute soak, with throughput plateauing at ~34 req/s regardless of further concurrency. This is
# a real capacity constraint that affects production traffic identically, not a benchmark-only
# artifact. 30 is a starting point, not a verified answer -- re-run bench/Makefile's bench-xc-003
# target after this lands to find the real plateau against MySQL's max_connections headroom.
spring.datasource.hikari.maximum-pool-size=30

# Base64 AES key for users.initial_password_encrypted (Identity.5, US-6.3). The literal below is a
# development/CI default only -- every real environment must set INITIAL_PASSWORD_KEY, since key
# storage and rotation are explicitly a build/ops concern (04-authentication-authorization.md §9).
app.security.initial-password-key=${INITIAL_PASSWORD_KEY:IoUV19v5ZzBW//5PXWmx12fm2R5TCiYpC6tnlrftOT0=}

# PM-017: GET /api/v1/auth/demo-accounts, a dev/QA convenience only (04-authentication-authorization.md
# §8). True by default here; application-prod.properties overrides this to false, which is the load-
# bearing safety guarantee -- the route and its seed data must not exist in production at all.
app.demo-accounts.enabled=true

# PM-029: actuator web exposure is OFF by default -- explicitly empty, not merely absent, since
# Spring Boot's own default without this key is "health only". application-benchmark.properties is
# the only place this is turned on (01-benchmark-strategy.md §8), closing hazard H8 without adding
# a new surface to every other profile.
management.endpoints.web.exposure.include=

# PM-047 (H6): a second, low-cost net alongside AsyncConfig#taskExecutor's widened sizing/
# CallerRunsPolicy and EventPublicationRecoveryJob's scheduled resubmission -- covers the "process
# crashed mid-cascade, then restarted" case that a live scheduled job can't reach on its own, since
# there's nothing running to resubmit against until the app comes back up.
spring.modulith.events.republish-outstanding-events-on-restart=true

# PM-048 (H5): the login bulkhead filter's permit count -- see LoginBulkheadFilter's Javadoc for
# why 20 is the accepted bound.
app.security.login-bulkhead.permits=20
