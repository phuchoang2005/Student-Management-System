post:
  tags: [Courses]
  summary: Create a course
  operationId: createCourse
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/course/CourseCreateRequest.yml"
  responses:
    "201":
      description: Course created successfully
      headers:
        Location:
          description: URI of the newly created course
          schema:
            type: string
            example: /api/v1/courses/101
      content:
        application/json:
          schema:
            $ref: "../components/schemas/course/CourseResponse.yml"
    "400":
      $ref: "../components/responses/ValidationError.yml"
    "409":
      $ref: "../components/responses/DuplicateResource.yml"
get:
  tags: [Courses]
  summary: Get a paginated list of courses
  operationId: getCourses
  parameters:
    - $ref: "../components/parameters/PageParam.yml"
    - $ref: "../components/parameters/SizeParam.yml"
    - $ref: "../components/parameters/SortParam.yml"
    - $ref: "../components/parameters/SearchParam.yml"
  responses:
    "200":
      description: Paginated list of courses
      content:
        application/json:
          schema:
            $ref: "../components/schemas/PageCourseResponse.yml"
