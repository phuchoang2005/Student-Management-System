type: object
properties:
  id:
    type: integer
    format: int64
    example: 10
  isbn:
    type: string
    example: "9780134685991"
  title:
    type: string
    example: Effective Java
  author:
    type: string
    example: Joshua Bloch
  publishedDate:
    type: string
    format: date
    example: 2018-01-06
  studentId:
    type: integer
    format: int64
    nullable: true
    example: 1
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
