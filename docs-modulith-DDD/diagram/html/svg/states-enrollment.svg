ENROLLED<br />(no second row, enrolledAt unchanged)<br />unenroll when not enrolled → 404<br />ENROLLMENT_NOT_FOUND<br />unknown student → 404, checked FIRST<br />unknown course → 404</p></span></div></foreignObject></g></g><g class="node statediagram-note" id="d18-svg-state-NotEnrolled----note-6" data-look="classic" transform="translate(148, 426)"><g class="basic label-container outer-path"><path d="M-115 -147 L115 -147 L115 147 L-115 147" stroke="none" stroke-width="0" fill="#fff5ad" style=""/><path d="M-115 -147 C-23.620938676536724 -147, 67.75812264692655 -147, 115 -147 M-115 -147 C-38.475464285741 -147, 38.049071428518005 -147, 115 -147 M115 -147 C115 -45.89810943858713, 115 55.203781122825745, 115 147 M115 -147 C115 -58.80021992434483, 115 29.39956015131034, 115 147 M115 147 C46.27202004603237 147, -22.455959907935267 147, -115 147 M115 147 C64.13532217567584 147, 13.270644351351692 147, -115 147 M-115 147 C-115 46.52232819435615, -115 -53.9553436112877, -115 -147 M-115 147 C-115 34.23520160450765, -115 -78.5295967909847, -115 -147" stroke="#aaaa33" stroke-width="1.3" fill="none" stroke-dasharray="0 0" style=""/></g><g class="label noteLabel" style="" transform="translate(-100, -132)"><rect/><foreignObject width="200" height="264"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel markdown-node-label"><p>Not enrolled is the ABSENCE of a row,<br />so it is also the state after the<br />student or the course is deleted.<br />There is no cancelled / suspended /<br />completed state — grading is out of<br />scope (glossary.md, Scope).</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="d18-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="d18-svg-drop-shadow-small" height="150%" width="150%"><feDrop