"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>both s and c exist as aggregates<br />(no row is created by creating a student or a course)</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(866.640625, 92)"><g class="label" data-id="d18-edge1" transform="translate(-100, -84)"><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>POST /students/{s}/courses/{c} (UC11)<br />EnrollmentService duplicate check passes<br />Enrollment.open(s, c) — 201 EnrollmentResponse</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(866.640625, 277)"><g class="label" data-id="d18-edge2" transform="translate(-100, -72)"><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>DELETE /students/{s}/courses/{c} (UC12)<br />existsById passes — 204<br />BOTH the student and the course survive</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(866.640625, 417)"><g class="label" data-id="d18-edge3" transform="translate(-100, -48)"><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>DELETE /students/{s} (UC5)<br />deleteByIdStudentId, in the enrollment module's<br />StudentDeleted listener</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(862.27416, 541.70812)"><g class="label" data-id="d18-edge4" transform="translate(-100, -60)"><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>DELETE /courses/{c} (UC10)<br />deleteByIdCourseId, in the enrollment module's<br />CourseDeleted listener</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="d18-Enrolled-Enrolled----note-5" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="d18-NotEnrolled----note-6-NotEnrolled" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node  statediagram-state" id="d18-svg-state-NotEnrolled-6" data-look="classic" transform="translate(639.8203125, 374)"><rect class="basic label-container" style="" rx="5" ry="5" x="-101.8203125" y="-44" width="203.640625" height="88"/><g class="label" style="" transform="translate(-93.8203125, -36)"><rect/><foreignObject width="187.640625" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel markdown-node-label"><p>Not enrolled<br />no row in student_courses<br />for (s, c)</p></span></div></foreignObject></g></g><g class="node  statediagram-state" id="d18-svg-state-Enrolled-5" data-look="classic" transform="translate(1099.640625, 368)"><rect class="basic label-container" s