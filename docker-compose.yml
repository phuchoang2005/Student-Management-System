services:
  mysql:
    image: mysql:8.4
    container_name: management-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-management}
      MYSQL_USER: ${MYSQL_USER:-management}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-management}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-management}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-management} -p${MYSQL_PASSWORD:-management}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
