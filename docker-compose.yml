services:
  postgres:
    image: postgres:16-alpine
    container_name: management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-management}
      POSTGRES_USER: ${POSTGRES_USER:-management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-management} -d ${POSTGRES_DB:-management}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
