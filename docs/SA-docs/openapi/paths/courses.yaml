collection:
  get:
    operationId: searchCourses
    tags: [Courses]
    summary: Search / list courses
    description: |
      **Roles:** All authenticated roles.
    x-roles: [REGISTRAR, LIBRARIAN, COURSE_ADMINISTRATOR, STUDENT]
    parameters:
      - $ref: '../components/parameters/common.yaml#/SearchQueryParam'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/SizeParam'
    responses:
      '200':
        description: A page of matching courses.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/PageMeta'
                - type: object
                  required: [content]
                  properties:
                    content:
                      type: array
                      items:
                        $ref: '../components/schemas/course.yaml#/CourseSummary'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'

  post:
    operationId: createCourse
    tags: [Courses]
    summary: Create a course
    description: |
      **Roles:** Course Administrator only.
    x-roles: [COURSE_ADMINISTRATOR]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/course.yaml#/CourseCreateRequest'
    responses:
      '201':
        description: Course created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/course.yaml#/CourseResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '409':
        description: courseCode already in use.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              timestamp: '2026-01-15T09:24:00Z'
              status: 409
              error: Conflict
              message: Course code 'CS101' is already in use.
              path: /api/v1/courses

item:
  get:
    operationId: getCourse
    tags: [Courses]
    summary: Get course detail
    description: |
      **Roles:** All authenticated roles.

      `page`/`size` page the embedded `roster`, not the course itself — a course detail
      response only ever has one paginated field.
    x-roles: [REGISTRAR, LIBRARIAN, COURSE_ADMINISTRATOR, STUDENT]
    parameters:
      - $ref: '../components/parameters/common.yaml#/CourseCodePathParam'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/SizeParam'
    responses:
      '200':
        description: Course detail, including a page of its current enrolled-student roster.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/course.yaml#/CourseDetail'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'

  put:
    operationId: updateCourse
    tags: [Courses]
    summary: Update a course
    description: |
      **Roles:** Course Administrator only. courseCode itself is immutable.
    x-roles: [COURSE_ADMINISTRATOR]
    parameters:
      - $ref: '../components/parameters/common.yaml#/CourseCodePathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/course.yaml#/CourseUpdateRequest'
    responses:
      '200':
        description: Updated course.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/course.yaml#/CourseResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'

  delete:
    operationId: removeCourse
    tags: [Courses]
    summary: Remove a course
    description: |
      **Roles:** Course Administrator only.

      Deletes the course row, then asynchronously publishes `CourseDeleted`, which deletes
      every enrollment referencing this course. The response does not wait for the cascade
      to complete.
    x-roles: [COURSE_ADMINISTRATOR]
    parameters:
      - $ref: '../components/parameters/common.yaml#/CourseCodePathParam'
    responses:
      '204':
        description: Course removed.
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
