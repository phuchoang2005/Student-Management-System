collection:
  get:
    operationId: searchBooks
    tags: [Books]
    summary: Search / list books
    description: |
      **Roles:** Librarian, Student. The Registrar and Course Administrator have no book workflow
      and no longer hold a read grant here (`02-component-diagram.md` §4). Student results are
      transparently scoped to the caller's own held books — `ownerStudentCode` is silently
      overridden rather than rejected, per api-specification.md §5 decision #4.
    x-roles: [LIBRARIAN, STUDENT]
    parameters:
      - $ref: '../components/parameters/common.yaml#/SearchQueryParam'
      - $ref: '../components/parameters/common.yaml#/OwnerFilterParam'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/SizeParam'
    responses:
      '200':
        description: A page of matching books.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/PageMeta'
                - type: object
                  required: [content]
                  properties:
                    content:
                      type: array
                      items:
                        $ref: '../components/schemas/book.yaml#/BookSummary'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'

  post:
    operationId: addBook
    tags: [Books]
    summary: Add a book to the catalog
    description: |
      **Roles:** Librarian only. An optional `ownerStudentCode` assigns the book to a student at
      creation time; it must reference an existing student.
    x-roles: [LIBRARIAN]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/book.yaml#/BookCreateRequest'
    responses:
      '201':
        description: Book added.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/book.yaml#/BookResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '409':
        description: isbn already in use.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              timestamp: '2026-01-15T09:24:00Z'
              status: 409
              error: Conflict
              message: ISBN '9780134685991' is already in use.
              path: /api/v1/books

item:
  get:
    operationId: getBook
    tags: [Books]
    summary: Get book detail
    description: |
      **Roles:** Librarian, Student. The Registrar and Course Administrator have no book workflow
      and no longer hold a read grant here (`02-component-diagram.md` §4). Student results are
      transparently scoped to the caller's own held books — `ownerStudentCode` is silently
      overridden rather than rejected, per api-specification.md §5 decision #4.
    x-roles: [LIBRARIAN, STUDENT]
    parameters:
      - $ref: '../components/parameters/common.yaml#/IsbnPathParam'
    responses:
      '200':
        description: Book detail, including the current owner's summary if any.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/book.yaml#/BookDetail'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'

  delete:
    operationId: removeBook
    tags: [Books]
    summary: Remove a book
    description: |
      **Roles:** Librarian only. No cascade — removing a book never affects other resources.
    x-roles: [LIBRARIAN]
    parameters:
      - $ref: '../components/parameters/common.yaml#/IsbnPathParam'
    responses:
      '204':
        description: Book removed.
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'

owner:
  patch:
    operationId: assignBookOwner
    tags: [Books]
    summary: Assign / reassign a book's owner
    description: |
      **Roles:** Librarian only. A book has at most one owner; assigning a new owner
      replaces any prior one.
    x-roles: [LIBRARIAN]
    parameters:
      - $ref: '../components/parameters/common.yaml#/IsbnPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/book.yaml#/BookOwnerRequest'
    responses:
      '200':
        description: Book with its new owner.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/book.yaml#/BookResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'

  delete:
    operationId: clearBookOwner
    tags: [Books]
    summary: End a book's ownership
    description: |
      **Roles:** Librarian only. Clears the holder; the book stays in the catalog. Idempotent —
      calling this on an already-unowned book still returns 200 with `ownerStudentCode: null`, since no
      other endpoint in this API models an "already in that state" 409.
    x-roles: [LIBRARIAN]
    parameters:
      - $ref: '../components/parameters/common.yaml#/IsbnPathParam'
    responses:
      '200':
        description: Book with ownership cleared.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/book.yaml#/BookResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
