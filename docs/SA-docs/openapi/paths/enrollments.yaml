collection:
  get:
    operationId: searchEnrollments
    tags: [Enrollments]
    summary: List enrollments, by student or by course
    description: |
      **Roles:** Registrar, Course Administrator. A Student cannot reach this endpoint — their own
      enrolled courses come from `GET /me/courses`, scoped by the session principal rather than by a
      student code the caller supplies (`04-authentication-authorization.md` §6.1).

      **Exactly one of `studentCode` or `courseCode` is required.** With neither, this would
      enumerate every enrollment in the system, which no use case asks for; with both, the answer is
      a single enrollment that `GET /enrollments/{studentCode}/{courseCode}` already addresses.
      Either mistake is a `400` naming both fields.

      Both directions return the same row shape, because they are the same rows viewed from
      different ends — filtering by `studentCode` answers "the courses this student is taking",
      filtering by `courseCode` answers "the students taking this course".
    x-roles: [REGISTRAR, COURSE_ADMINISTRATOR]
    parameters:
      - $ref: '../components/parameters/common.yaml#/StudentCodeFilterParam'
      - $ref: '../components/parameters/common.yaml#/CourseCodeFilterParam'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/SizeParam'
    responses:
      '200':
        description: A page of enrollments. An empty page when the filter matches nothing.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/enrollment.yaml#/EnrollmentPage'
      '400':
        description: |
          Neither filter supplied, both supplied, or the supplied code references no such
          student/course.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ValidationError'
            example:
              timestamp: '2026-01-15T09:24:00Z'
              status: 400
              error: Bad Request
              message: Supply exactly one of 'studentCode' or 'courseCode'.
              path: /api/v1/enrollments
              errors:
                - field: studentCode
                  message: Supply exactly one of 'studentCode' or 'courseCode'.
                - field: courseCode
                  message: Supply exactly one of 'studentCode' or 'courseCode'.
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'

  post:
    operationId: createEnrollment
    tags: [Enrollments]
    summary: Enroll a student in a course
    description: |
      **Roles:** Registrar. Student self-service enrollment is out of scope.

      Both `studentCode` and `courseCode` are validated to exist before the duplicate-enrollment
      check runs. Resolving `studentCode` to the surrogate id the `enrollments.student_id` FK needs
      *is* that existence check, so an unknown student is a `400` like any other unresolvable
      reference (api-specification.md §5 decision #2).
    x-roles: [REGISTRAR]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/enrollment.yaml#/EnrollmentCreateRequest'
    responses:
      '201':
        description: Enrollment created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/enrollment.yaml#/EnrollmentResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '409':
        description: This student is already enrolled in this course.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              timestamp: '2026-01-15T09:24:00Z'
              status: 409
              error: Conflict
              message: Student 'S00123' is already enrolled in course 'CS101'.
              path: /api/v1/enrollments

batch:
  post:
    operationId: enrollStudentInCourses
    tags: [Enrollments]
    summary: Enroll a student in several courses at once
    description: |
      **Roles:** Registrar. UC-26.

      **Answers 200, and reports each course separately.** One rejected course does not cost the
      others: unknown and already-enrolled courses come back as per-course outcomes while the rest
      are enrolled. Even a request in which every course was rejected is a 200 — the request itself
      succeeded, and the statuses are its answer.

      Not `207 Multi-Status`: that is a WebDAV code defined against a `DAV:multistatus` XML body, so
      using it for a bespoke JSON shape would be a status-code pun. Not `201` either — there is no
      single `Location` and creation is partial by design. See api-specification.md §5 decision #12.

      **An unknown student is still a whole-request 400.** The student is the subject of the request
      rather than one of its items, so an unknown one leaves every course unanswerable — the same
      answer `POST /enrollments` gives.

      **This is the one endpoint in the API where a request is not a single transaction.** Each
      course is committed on its own, so the courses reported as `ENROLLED` are already durable and
      are not rolled back by a rejection later in the list. Retrying the whole request is safe: the
      courses that succeeded come back as `ALREADY_ENROLLED`.
    x-roles: [REGISTRAR]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/enrollment.yaml#/BatchEnrollmentRequest'
    responses:
      '200':
        description: |
          The request was processed. Each requested course carries its own outcome; check `enrolled`
          and `failed` rather than the status code to learn what happened.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/enrollment.yaml#/BatchEnrollmentResponse'
            example:
              studentCode: S00123
              requested: 3
              enrolled: 2
              failed: 1
              results:
                - courseCode: CS101
                  status: ENROLLED
                  enrolledAt: '2026-01-15T09:24:00Z'
                  message: null
                - courseCode: ZZ999
                  status: UNKNOWN_COURSE
                  enrolledAt: null
                  message: Course 'ZZ999' does not exist.
                - courseCode: MA201
                  status: ENROLLED
                  enrolledAt: '2026-01-15T09:24:00Z'
                  message: null
      '400':
        description: |
          The student does not exist, or the body failed validation — `courseCodes` empty, longer
          than 50, or containing a blank/over-length code. Nothing is enrolled.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'

item:
  get:
    operationId: getEnrollment
    tags: [Enrollments]
    summary: Get enrollment detail
    description: |
      **Roles:** Registrar, Course Administrator. Not the enrolled Student: role STUDENT holds no
      grant on `/enrollments/**` at all.

      An unresolvable `studentCode` is a `404` here, not the `400` a reference gets — see that
      parameter's own description for why.
    x-roles: [REGISTRAR, COURSE_ADMINISTRATOR]
    parameters:
      - $ref: '../components/parameters/common.yaml#/EnrollmentStudentCodePathParam'
      - $ref: '../components/parameters/common.yaml#/EnrollmentCourseCodePathParam'
    responses:
      '200':
        description: Enrollment detail, with the student's and course's summaries.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/enrollment.yaml#/EnrollmentDetail'
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'

  delete:
    operationId: endEnrollment
    tags: [Enrollments]
    summary: End an enrollment
    description: |
      **Roles:** Registrar. Student self-service withdrawal is out of scope. Removes only
      the student–course link; neither the student nor the course record is affected.
    x-roles: [REGISTRAR]
    parameters:
      - $ref: '../components/parameters/common.yaml#/EnrollmentStudentCodePathParam'
      - $ref: '../components/parameters/common.yaml#/EnrollmentCourseCodePathParam'
    responses:
      '204':
        description: Enrollment ended.
      '401':
        $ref: '../components/responses/errors.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/errors.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFound'
