openapi: 3.0.3
info:
  title: Student Management System API
  version: "1.0.0"
  description: |
    REST contract for the Student Management System — a single-deployable, backend-only
    Spring Boot / Spring Modulith application with one MySQL 8 schema
    (see `../01-system-overview.md`). This spec is hand-authored from the Solution
    Architecture documents (`../02-component-diagram.md` through `../05-database-schema.md`);
    no backend implementation exists yet to generate it from — see
    `../api-specification.md` for full conventions and the design decisions made while
    filling gaps the source docs left open.

    **Base path:** every operation below is relative to `/api/v1`.

    **Auth:** session-based, not token-based. `POST /auth/login` opens a server-side HTTP
    session and sets the `JSESSIONID` cookie (see the `cookieAuth` security scheme below);
    there is no bearer/JWT token anywhere in this API.

    **Roles:** SYSTEM_ADMINISTRATOR, REGISTRAR, LIBRARIAN, COURSE_ADMINISTRATOR, STUDENT. Every
    operation states its allowed roles in its description and in the machine-readable `x-roles`
    extension. Student principals are further scoped to their own records where noted. System
    Administrator is scoped solely to `/staff-accounts` — it has no access to any domain data.

    **must-change-password gate:** while `principal.mustChangePassword = true`, every
    endpoint except `POST /auth/password` responds 403 Forbidden.

    **Error shape:** every non-2xx response uses `Error` (or `ValidationError` for 400s,
    which adds a per-field `errors` list) — Spring Boot's default error body shape.
  license:
    name: Proprietary — internal use only
    url: https://internal.example/license
servers:
  - url: https://api.studentmanagement.internal/api/v1
    description: Placeholder — no backend is deployed yet; update once a real environment exists.
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Login, password management, session lifecycle, and (dev/test only) demo accounts.
  - name: Staff Accounts
    description: Creating and deactivating Registrar/Librarian/Course Administrator accounts — owned by the System Administrator role.
  - name: Students
    description: Student records — owned by the Registrar role.
  - name: Books
    description: Book catalog and ownership — owned by the Librarian role.
  - name: Courses
    description: Course offerings — owned by the Course Administrator role.
  - name: Enrollments
    description: Student-course enrollment links.
  - name: Self-Service
    description: Composite read endpoints scoped to the calling Student principal.
paths:
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/password:
    $ref: './paths/auth.yaml#/password'
  /auth/demo-accounts:
    $ref: './paths/auth.yaml#/demoAccounts'
  /staff-accounts:
    $ref: './paths/staff-accounts.yaml#/collection'
  '/staff-accounts/{id}/status':
    $ref: './paths/staff-accounts.yaml#/status'
  /students:
    $ref: './paths/students.yaml#/collection'
  '/students/{code}':
    $ref: './paths/students.yaml#/item'
  '/students/{code}/initial-password':
    $ref: './paths/students.yaml#/initialPassword'
  /books:
    $ref: './paths/books.yaml#/collection'
  '/books/{isbn}':
    $ref: './paths/books.yaml#/item'
  '/books/{isbn}/owner':
    $ref: './paths/books.yaml#/owner'
  /courses:
    $ref: './paths/courses.yaml#/collection'
  '/courses/{code}':
    $ref: './paths/courses.yaml#/item'
  /enrollments:
    $ref: './paths/enrollments.yaml#/collection'
  '/enrollments/{studentId}/{courseCode}':
    $ref: './paths/enrollments.yaml#/item'
  /me/books-and-courses:
    $ref: './paths/me.yaml#/booksAndCourses'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-side session cookie issued by `POST /auth/login` (Spring Security default, session-based — not JWT/bearer).
