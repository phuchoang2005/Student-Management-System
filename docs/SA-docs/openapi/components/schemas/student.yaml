StudentCreateRequest:
  type: object
  required: [studentCode, firstName, lastName, email, dateOfBirth]
  properties:
    studentCode:
      type: string
      maxLength: 20
      example: S00123
    firstName:
      type: string
      maxLength: 100
    lastName:
      type: string
      maxLength: 100
    email:
      type: string
      format: email
      maxLength: 255
    dateOfBirth:
      type: string
      format: date

StudentUpdateRequest:
  type: object
  description: Same as StudentCreateRequest minus studentCode, which is immutable once assigned and is supplied via the path instead.
  required: [firstName, lastName, email, dateOfBirth]
  properties:
    firstName:
      type: string
      maxLength: 100
    lastName:
      type: string
      maxLength: 100
    email:
      type: string
      format: email
      maxLength: 255
    dateOfBirth:
      type: string
      format: date

StudentResponse:
  type: object
  description: No surrogate `id` — a student is named by `studentCode` everywhere the API is reachable from (api-specification.md §5 decision #9).
  required: [studentCode, firstName, lastName, email, dateOfBirth, createdAt, updatedAt]
  properties:
    studentCode:
      type: string
    firstName:
      type: string
    lastName:
      type: string
    email:
      type: string
      format: email
    dateOfBirth:
      type: string
      format: date
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

StudentRegistrationResponse:
  description: |
    Returned only from `POST /students`. Includes the auto-provisioned login account's
    username and one-time plaintext initial password — this is the only response in the
    entire API where the plaintext password is ever shown; afterward it is retrievable
    only via `GET /students/{code}/initial-password`, and only until it is changed.
  allOf:
    - $ref: '#/StudentResponse'
    - type: object
      required: [username, initialPassword]
      properties:
        username:
          type: string
          description: Equal to email at provisioning time.
        initialPassword:
          type: string
          description: System-generated 8-character alphanumeric password, shown once.

StudentSummary:
  type: object
  required: [studentCode, firstName, lastName, email]
  properties:
    studentCode:
      type: string
    firstName:
      type: string
    lastName:
      type: string
    email:
      type: string
      format: email

StudentDetail:
  description: |
    The student record alone. Owned books and enrolled courses are deliberately not embedded: each is
    a separately paged, separately authorized read (`GET /books?ownerStudentCode=` for the Librarian,
    `GET /enrollments?studentCode=` for the Registrar and Course Administrator), and a role that may
    read a student record is not automatically allowed to read both sides of it
    (api-specification.md §5 decision #10).
  allOf:
    - $ref: '#/StudentResponse'

StudentPage:
  description: A page of student summaries.
  allOf:
    - $ref: './common.yaml#/PageMeta'
    - type: object
      required: [content]
      properties:
        content:
          type: array
          items:
            $ref: '#/StudentSummary'

InitialPasswordResponse:
  type: object
  required: [username, initialPassword]
  properties:
    username:
      type: string
    initialPassword:
      type: string
