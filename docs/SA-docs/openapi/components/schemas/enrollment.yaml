EnrollmentCreateRequest:
  type: object
  description: |
    Both sides are business keys. The surrogate `students.id` behind `enrollments.student_id` is
    resolved server-side and never supplied by a caller (api-specification.md §5 decision #9).
  required: [studentCode, courseCode]
  properties:
    studentCode:
      type: string
      maxLength: 20
      example: S00123
      description: Must reference an existing student, or the request is rejected with 400.
    courseCode:
      type: string
      maxLength: 20
      example: CS101
      description: Must reference an existing course, or the request is rejected with 400.

EnrollmentResponse:
  type: object
  description: |
    Keyed by the `studentCode`/`courseCode` pair the caller supplied, with no surrogate id: the pair
    is what `GET`/`DELETE /enrollments/{studentCode}/{courseCode}` address, so an enrollment id would
    be a value no endpoint accepts back.
  required: [studentCode, courseCode, enrolledAt]
  properties:
    studentCode:
      type: string
      example: S00123
    courseCode:
      type: string
      example: CS101
    enrolledAt:
      type: string
      format: date-time

EnrollmentDetail:
  type: object
  description: |
    One enrollment, both sides resolved. Also the row type of
    `GET /enrollments?studentCode=|courseCode=`: filtering by either side yields the same rows viewed
    from a different end, so one schema serves both rather than two endpoints with divergent shapes.
    The redundant side is constant across a page — every row shares a `student` when filtering by
    `studentCode`, a `course` when filtering by `courseCode` — which is what lets one client render
    "this student's courses" and another "this course's roster" off the same response.
  required: [student, course, enrolledAt]
  properties:
    student:
      $ref: './student.yaml#/StudentSummary'
    course:
      $ref: './course.yaml#/CourseSummary'
    enrolledAt:
      type: string
      format: date-time

EnrollmentPage:
  description: A page of enrollments, filtered by exactly one of `studentCode` or `courseCode`.
  allOf:
    - $ref: './common.yaml#/PageMeta'
    - type: object
      required: [content]
      properties:
        content:
          type: array
          items:
            $ref: '#/EnrollmentDetail'

BatchEnrollmentRequest:
  type: object
  description: |
    One student, several courses. The same business-key rule as `EnrollmentCreateRequest`
    (api-specification.md §5 decision #9).

    The 50-course cap follows from the per-course transaction boundary described on
    `POST /enrollments/batch`: each course costs its own round trip, and past that a client should be
    making more than one request.
  required: [studentCode, courseCodes]
  properties:
    studentCode:
      type: string
      maxLength: 20
      example: S00123
      description: |
        Must reference an existing student, or the whole request is rejected with 400 — the student
        is the subject of the request rather than one of its items.
    courseCodes:
      type: array
      minItems: 1
      maxItems: 50
      description: |
        A course named more than once is enrolled once and reported once; the duplicates are dropped
        before processing, keeping the first occurrence. Reporting `ENROLLED` and then
        `ALREADY_ENROLLED` for the same code would be accurate and indistinguishable from a defect.
      items:
        type: string
        maxLength: 20
      example: [CS101, CS102, MA201]

BatchEnrollmentStatus:
  type: string
  description: |
    What happened to one requested course. `ENROLLED` is the only success; the rest carry a
    human-readable `message` instead of an `enrolledAt`.
  enum:
    - ENROLLED
    - UNKNOWN_COURSE
    - ALREADY_ENROLLED
    - INVALID_COURSE_CODE

BatchEnrollmentResult:
  type: object
  required: [courseCode, status]
  properties:
    courseCode:
      type: string
      example: CS101
    status:
      $ref: '#/BatchEnrollmentStatus'
    enrolledAt:
      type: string
      format: date-time
      nullable: true
      description: Present only when `status` is `ENROLLED`.
    message:
      type: string
      nullable: true
      description: Present only when `status` is not `ENROLLED`.

BatchEnrollmentResponse:
  type: object
  description: |
    Deliberately not the `Error`/`ValidationError` envelope: those describe a request that failed,
    and this request succeeded — the per-course `status` values are its answer. That is why the
    endpoint returns 200 even when every course was rejected (api-specification.md §5 decision #12).

    The counts are denormalised so a client can render "3 of 5 enrolled" without walking `results`.
  required: [studentCode, requested, enrolled, failed, results]
  properties:
    studentCode:
      type: string
      example: S00123
    requested:
      type: integer
      format: int32
      description: |
        Distinct courses processed. Below the number submitted when the request repeated a course.
    enrolled:
      type: integer
      format: int32
    failed:
      type: integer
      format: int32
    results:
      type: array
      description: In request order, minus duplicates. One entry per distinct requested course.
      items:
        $ref: '#/BatchEnrollmentResult'
