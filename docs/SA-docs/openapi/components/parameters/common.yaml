SearchQueryParam:
  name: query
  in: query
  required: false
  description: Free-text search term matched against the resource's business-key and name-like fields. Omit to return all results.
  schema:
    type: string

OwnerFilterParam:
  name: owner
  in: query
  required: false
  description: Restrict results to books currently owned by this student id.
  schema:
    type: integer
    format: int64

PageParam:
  name: page
  in: query
  required: false
  description: Zero-based page number to return. Values below 0 are rejected with `400`.
  schema:
    type: integer
    format: int32
    minimum: 0
    default: 0

SizeParam:
  name: size
  in: query
  required: false
  description: Number of records per page. Values outside 1-100 are rejected with `400`.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 20

BooksPageParam:
  name: booksPage
  in: query
  required: false
  description: Zero-based page number for the `books` collection, paged independently from `courses`.
  schema:
    type: integer
    format: int32
    minimum: 0
    default: 0

BooksSizeParam:
  name: booksSize
  in: query
  required: false
  description: Page size for the `books` collection. Values outside 1-100 are rejected with `400`.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 20

CoursesPageParam:
  name: coursesPage
  in: query
  required: false
  description: Zero-based page number for the `courses` collection, paged independently from `books`.
  schema:
    type: integer
    format: int32
    minimum: 0
    default: 0

CoursesSizeParam:
  name: coursesSize
  in: query
  required: false
  description: Page size for the `courses` collection. Values outside 1-100 are rejected with `400`.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 20

StudentCodePathParam:
  name: code
  in: path
  required: true
  description: The student's business-key code (`students.student_code`).
  schema:
    type: string
    maxLength: 20

CourseCodePathParam:
  name: code
  in: path
  required: true
  description: The course's business-key code (`courses.course_code`).
  schema:
    type: string
    maxLength: 20

IsbnPathParam:
  name: isbn
  in: path
  required: true
  description: The book's ISBN (`books.isbn`).
  schema:
    type: string
    maxLength: 20

EnrollmentStudentIdPathParam:
  name: studentId
  in: path
  required: true
  description: Surrogate id of the enrolled student (`students.id`).
  schema:
    type: integer
    format: int64

EnrollmentCourseCodePathParam:
  name: courseCode
  in: path
  required: true
  description: Business-key code of the course (`courses.course_code`).
  schema:
    type: string
    maxLength: 20
