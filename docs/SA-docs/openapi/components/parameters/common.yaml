StudentCodeFilterParam:
  name: studentCode
  in: query
  required: false
  description: |
    Restrict enrollments to this student — i.e. "the courses this student is taking". Mutually
    exclusive with `courseCode`; exactly one of the two is required. An unresolvable code is a `400`.
  schema:
    type: string
    maxLength: 20

CourseCodeFilterParam:
  name: courseCode
  in: query
  required: false
  description: |
    Restrict enrollments to this course — i.e. "the students taking this course". Mutually exclusive
    with `studentCode`; exactly one of the two is required. An unresolvable code is a `400`.
  schema:
    type: string
    maxLength: 20

SearchQueryParam:
  name: query
  in: query
  required: false
  description: Free-text search term matched against the resource's business-key and name-like fields. Omit to return all results.
  schema:
    type: string

OwnerFilterParam:
  name: ownerStudentCode
  in: query
  required: false
  description: |
    Restrict results to books currently held by this student, named by business-key code — the
    surrogate `students.id` is never accepted here (api-specification.md §5 decision #9). An
    unresolvable code is a `400`. This is how a Librarian pulls up one student's borrowed books.
  schema:
    type: string
    maxLength: 20

PageParam:
  name: page
  in: query
  required: false
  description: Zero-based page number to return. A page past the end returns `200` with empty `content`.
  schema:
    type: integer
    format: int32
    minimum: 0
    default: 0

SizeParam:
  name: size
  in: query
  required: false
  description: Number of records per page, clamped to 100 by `spring.data.web.pageable.max-page-size`.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 20

StudentCodePathParam:
  name: code
  in: path
  required: true
  description: The student's business-key code (`students.student_code`).
  schema:
    type: string
    maxLength: 20

CourseCodePathParam:
  name: code
  in: path
  required: true
  description: The course's business-key code (`courses.course_code`).
  schema:
    type: string
    maxLength: 20

IsbnPathParam:
  name: isbn
  in: path
  required: true
  description: The book's ISBN (`books.isbn`).
  schema:
    type: string
    maxLength: 20

EnrollmentStudentCodePathParam:
  name: studentCode
  in: path
  required: true
  description: |
    Business-key code of the enrolled student (`students.student_code`). An unresolvable code is a
    `404` here rather than the `400` a *reference* gets, because it is part of the address of one
    enrollment — an enrollment whose student does not exist cannot exist either, and answering
    differently would leak whether the student does.
  schema:
    type: string
    maxLength: 20

EnrollmentCourseCodePathParam:
  name: courseCode
  in: path
  required: true
  description: Business-key code of the course (`courses.course_code`).
  schema:
    type: string
    maxLength: 20
