type: object
description: Lightweight student view used when referenced by another resource.
properties:
  id:
    type: integer
    format: int64
    example: 1
  studentCode:
    type: string
    example: STU001
  firstName:
    type: string
    example: John
  lastName:
    type: string
    example: Smith
  email:
    type: string
    format: email
    example: john.smith@example.com
