type: object
required: [courseCode, name, credits]
properties:
  courseCode:
    type: string
    minLength: 1
    example: CS101
  name:
    type: string
    minLength: 1
    example: Introduction to Programming
  description:
    type: string
    example: Fundamentals of programming
  credits:
    type: integer
    minimum: 1
    example: 3
