name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: management
          MYSQL_USER: management
          MYSQL_PASSWORD: management
          MYSQL_ROOT_PASSWORD: management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -umanagement -pmanagement"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: management/pom.xml

      - name: mvn verify
        working-directory: management
        run: ./mvnw --batch-mode --no-transfer-progress verify
